# Netlify Configuration for SAAS Engineering Technical Services Ltd

[build]
  publish = "."

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets for performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean routing for admin portal
[[redirects]]
  from = "/admin"
  to = "/1/1/1/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/1/1/1/admin/:splat"
  status = 200
